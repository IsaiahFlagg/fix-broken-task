name: Bugged verifier proof

on:
  push:
    branches:
      - test-submission-file-save

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      - name: Install Harbor
        run: uv tool install harbor==0.19.0

      - name: Run intentionally broken oracle
        run: harbor run -p ./task -a oracle

      - name: Show verifier failure
        run: |
          reward_file="$(find . -type f -path '*/verifier/reward.txt' -print -quit)"
          ctrf_file="$(find . -type f -path '*/verifier/ctrf.json' -print -quit)"

          test -n "$reward_file"
          test -n "$ctrf_file"

          echo "=== reward.txt ==="
          cat "$reward_file"

          echo "=== ctrf.json ==="
          python -m json.tool "$ctrf_file"

          test "$(tr -d '[:space:]' < "$reward_file")" = "0"

      - name: Upload failing verifier output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bugged-verifier-output
          path: |
            **/verifier/reward.txt
            **/verifier/ctrf.json
          retention-days: 5
